version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lexai_postgres
    restart: always
    environment:
      POSTGRES_USER: lex_admin
      POSTGRES_PASSWORD: SecurePass123
      POSTGRES_DB: lexai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
